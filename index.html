<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <main class="login-page">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo-area">
                <img src="img/logo.png" alt="Logo Papelaria">
            </div>

            <!-- Título -->
            <div class="login-title">

                <h1>Bem-vindo de volta</h1>

                <p>
                    Entre na sua conta e continue organizando suas ideias,
                    sonhos e projetos.
                </p>

            </div>

            <!-- Formulário -->

            <form id="loginForm">

                <!-- Email -->

                <div class="input-group">

                    <i class="bi bi-envelope"></i>

                    <input type="email" id="email" placeholder="E-mail ou usuário" required>

                </div>

                <!-- Senha -->

                <div class="input-group">

                    <i class="bi bi-lock"></i>

                    <input type="password" id="senha" placeholder="Sua senha" required>

                    <button type="button" id="mostrarSenha" class="btn-password">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

                <!-- Links -->

                <div class="login-links">

                    <a href="#">Esqueceu sua senha?</a>

                    <a href="#">Criar conta</a>

                </div>

                <!-- Botão -->

                <button type="submit" class="btn-login">

                    Entrar na minha conta

                </button>

            </form>

            <!-- Linha -->

            <div class="divider">

                <span>ou acesse com</span>

            </div>

            <!-- Redes -->

            <div class="social-login">

                <button>

                    <i class="bi bi-google"></i>

                </button>

                <button>

                    <i class="bi bi-apple"></i>

                </button>

                <button>

                    <i class="bi bi-facebook"></i>

                </button>

            </div>

            <!-- Rodapé -->

            <div class="login-footer">

                <small>
                    © 2026 Aurora Papelaria
                </small>

            </div>

        </div>

    </main>
</body>

</html>
