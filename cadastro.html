<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta</title>
    <link rel="stylesheet" href="cadastro.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Logo -->

            <img src="https://i.imgur.com/DnPA7DT.png" alt="Logo Ateliê LM Criações" class="logo">

            <!-- Título -->

            <h1>Criar Conta</h1>

            <p>

                Cadastre-se e faça parte do Ateliê LM Criações.

            </p>

            <!-- Formulário -->

            <form id="cadastroForm">

                <!-- Nome -->

                <div class="input-box">

                    <i class="bi bi-person-fill"></i>

                    <input type="text" id="nome" placeholder="Nome completo" required>

                </div>

                <!-- E-mail -->

                <div class="input-box">

                    <i class="bi bi-envelope-fill"></i>

                    <input type="email" id="email" placeholder="Seu e-mail" required>

                </div>

                <!-- Telefone -->

                <div class="input-box">

                    <i class="bi bi-telephone-fill"></i>

                    <input type="tel" id="telefone" placeholder="Telefone / WhatsApp" required>

                </div>

                <!-- Senha -->

                <div class="input-box">

                    <i class="bi bi-lock-fill"></i>

                    <input type="password" id="senha" placeholder="Crie uma senha" required>

                </div>

                <!-- Confirmar senha -->

                <div class="input-box">

                    <i class="bi bi-shield-lock-fill"></i>

                    <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required>

                </div>

                <!-- Termos -->

                <div class="checkbox">

                    <input type="checkbox" id="termos" required>

                    <label for="termos">

                        Li e aceito os termos de uso.

                    </label>

                </div>

                <!-- Botão -->

                <button type="submit">

                    Criar Conta

                </button>

            </form>

            <!-- Divisor -->

            <div class="divider">

                <span>ou cadastre-se com</span>

            </div>

            <!-- Redes -->

            <div class="social-login">

                <a href="#" class="social-btn google">

                    <i class="bi bi-google"></i>

                </a>

                <a href="#" class="social-btn facebook">

                    <i class="bi bi-facebook"></i>

                </a>

                <a href="#" class="social-btn instagram">

                    <i class="bi bi-instagram"></i>

                </a>

            </div>

            <!-- Rodapé -->

            <div class="links">

                <span>

                    Já possui uma conta?

                </span>

                <a href="login.html">

                    Entrar

                </a>

            </div>

        </div>

    </div>

    <script src="js/cadastro.js"></script>

</body>

</html>
