<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha</title>
    <!-- CSS -->
    <link rel="stylesheet" href="esqueci-senha.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

    <div class="recuperar-container">

        <div class="recuperar-card">

            <!-- Logo -->

            <img src="https://i.imgur.com/DnPA7DT.png" alt="Logo Ateliê LM Criações" class="logo">

            <!-- Título -->

            <h1>Esqueceu sua senha?</h1>

            <p>

                Não se preocupe! Digite o e-mail cadastrado abaixo e enviaremos um link para redefinir sua senha.

            </p>

            <!-- Formulário -->

            <form id="recuperarForm">

                <div class="input-box">

                    <i class="bi bi-envelope-fill"></i>

                    <input type="email" id="email" placeholder="Digite seu e-mail" required>

                </div>

                <button type="submit">

                    Enviar link de recuperação

                </button>

            </form>

            <!-- Voltar -->

            <div class="links">

                <a href="login.html">

                    <i class="bi bi-arrow-left"></i>

                    Voltar para o Login

                </a>

            </div>

        </div>

    </div>

</body>

</html>
